[package]
name = "redox_installer"
version = "0.2.42"
description = "A Redox filesystem builder"
license = "MIT"
authors = ["Jeremy Soller <jackpot51@gmail.com>"]
repository = "https://gitlab.redox-os.org/redox-os/installer"
default-run = "redox_installer"
edition = "2021"

[[bin]]
name = "redox_installer"
path = "src/bin/installer.rs"
required-features = ["installer"]

[[bin]]
name = "redox_installer_tui"
path = "src/bin/installer_tui.rs"
required-features = ["installer"]

[lib]
name = "redox_installer"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
arg_parser = "0.1.0"
fatfs = { version = "0.3.0", optional = true }
fscommon = { version = "0.1.1", optional = true }
gpt = { version = "3.0.0", optional = true }
libc = { version = "0.2.70", optional = true }
pkgar = { version = "0.2.2", optional = true }
pkgar-core = { version = "0.2.2", optional = true }
pkgar-keys = { version = "0.2.2", optional = true }
rand = { version = "0.9", optional = true }
redox-pkg = { version = "0.3.1", features = ["indicatif"], optional = true }
redox_syscall = { version = "0.9", optional = true }
redoxfs = { version = "0.9.1", optional = true, default-features = false, features = ["std", "log"] }
rust-argon2 = { version = "3", optional = true }
serde = "1"
serde_derive = "1.0"
termion = { version = "4", optional = true }
toml = "0.8"
uuid = { version = "1.4", features = ["v4"], optional = true }

[target.'cfg(target_os = "redox")'.dependencies]
libredox = { version = "0.1", optional = true }
ring = { version = "=0.17.8", optional = true }

[features]
default = ["installer", "fuse"]
installer = [
    "fatfs",
    "fscommon",
    "gpt",
    "libc",
    "libredox",
    "pkgar",
    "pkgar-core",
    "pkgar-keys",
    "rand",
    "redox-pkg",
    "redox_syscall",
    "redoxfs",
    "ring",
    "rust-argon2",
    "termion",
    "uuid",
]
fuse = ["redoxfs/fuse"]

[patch.crates-io]
# R-F19: without this, redox_installer links redoxfs FROM CRATES.IO, so the mount it
# performs INSIDE ITS OWN PROCESS bypasses the E-OS fork entirely and no fix in the fork
# can ever reach it. Both sides carry version 0.9.1, which is exactly what made the
# divergence invisible to every gate that looks at recipes and pins.
redoxfs = { git = "https://github.com/Gh0s777tt/eos-redoxfs.git", rev = "58824d70a0" }

# Same defect, separately found by scripts/eos-fork-linkage.py: `redox-pkg` is the crate
# (directory pkg-lib) that carries E-OS's manifest signature verification, R-703's client
# half -- and the installer was linking upstream's copy from crates.io. Checked on the
# built binary with the instrument controlled first (pkgar 11, redox_installer 7): all
# four E-OS signature literals appeared 0 times. The installer is the component that
# writes a fresh system to disk, so it is the last place that should verify packages with
# someone else's code.
redox-pkg = { git = "https://github.com/Gh0s777tt/eos-pkgutils.git", rev = "5978425ecd" }
# https://github.com/briansmith/ring/issues/1999
ring = { git = "https://gitlab.redox-os.org/redox-os/ring.git", branch = "redox-0.17.8" }
